group 'com.fuli.messaging_ingest'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 35
    namespace 'com.fuli.messaging_ingest'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 23
    }
}

dependencies {
    // NotificationCompat.MessagingStyle.extractMessagingStyleFromNotification
    // is the whole reason this plugin works. It is androidx-only — the
    // framework Notification.MessagingStyle has no equivalent extractor.
    implementation 'androidx.core:core-ktx:1.13.1'

    // The phone writes captured texts to Firestore ITSELF (DeviceTextWriter),
    // in the process the listener service keeps alive with no Flutter engine.
    // These artifacts are already in the APK through the flutterfire plugins,
    // but those declare them `implementation`-scoped to their own modules, so
    // nothing here compiles against them without an explicit dependency. The
    // BoM version matches `FirebaseSDKVersion` in firebase_core's
    // android/gradle.properties (34.17.0 on 2026-09-07); Gradle resolves the
    // higher of the two if they ever differ.
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
    // A captured picture is copied to Storage as the message is written
    // (AttachmentUploader) — the bytes live in an MMS part or behind a
    // notification URI grant, and neither is reachable from the browser the
    // member reads their threads in. Same reasoning as the two above: the
    // artifact is already in the APK via the firebase_storage plugin, but
    // scoped to that module.
    implementation 'com.google.firebase:firebase-storage'
    // Release builds install Play Integrity before the first request — the
    // Dart side does the same from BootService, but only when an engine runs.
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
}
